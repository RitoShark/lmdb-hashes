name: Update Name Tables

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-name-tables
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --release -- output work
      - name: Publish version 2 tables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FP=$(cat output/fingerprint-v2.sha256)
          TAG="names-v2-${FP:0:16}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "### Unchanged: $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > output/release-notes.md <<EOF
          Name-only hash tables from CommunityDragon, format version 2.

          - lol-names-v2-combined.txt.zst: GAME, ENTRIES, HASHES, FIELDS, TYPES
          - lol-names-v2-wad.txt.zst: GAME
          - lol-names-v2-bin.txt.zst: ENTRIES, HASHES, FIELDS, TYPES

          Decompress to UTF-8 text. Hashes are calculated by the reader; BIN universes stay separate.
          These files are not LMDB databases. Version 2 is published as a prerelease during consumer migration, preserving the latest legacy LMDB release.

          [File format](https://github.com/RitoShark/lmdb-hashes/blob/${GITHUB_SHA}/docs/file-format.md)
          [Migration guide](https://github.com/RitoShark/lmdb-hashes/blob/${GITHUB_SHA}/docs/migration.md)

          Source fingerprint: $FP
          EOF
          gh release create "$TAG" \
            output/lol-names-v2-combined.txt.zst \
            output/lol-names-v2-wad.txt.zst \
            output/lol-names-v2-bin.txt.zst \
            output/fingerprint-v2.sha256 \
            --target "$GITHUB_SHA" \
            --title "Name tables $TAG" \
            --notes-file output/release-notes.md \
            --prerelease --latest=false
          echo "### Published: $TAG" >> "$GITHUB_STEP_SUMMARY"
