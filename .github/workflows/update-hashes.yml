name: Update Hash DB

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build hash-builder
        run: cargo build --release

      - name: Run hash-builder
        run: ./target/release/lmdb-hash-builder output work

      - name: Check if output exists
        id: check
        run: |
          if [ -f output/lol-hashes-combined.zst ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            echo "combined_size=$(stat -c%s output/lol-hashes-combined.zst)" >> $GITHUB_OUTPUT
            echo "wad_size=$(stat -c%s output/lol-hashes-wad.zst)" >> $GITHUB_OUTPUT
            echo "bin_size=$(stat -c%s output/lol-hashes-bin.zst)" >> $GITHUB_OUTPUT
            echo "fingerprint=$(cat output/fingerprint.sha256)" >> $GITHUB_OUTPUT
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if release already exists
        if: steps.check.outputs.has_output == 'true'
        id: existing
        run: |
          FP="${{ steps.check.outputs.fingerprint }}"
          TAG="v${FP:0:12}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check.outputs.has_output == 'true' && steps.existing.outputs.exists == 'false'
        run: |
          TAG="${{ steps.existing.outputs.tag }}"
          COMBINED_MB=$(echo "scale=1; ${{ steps.check.outputs.combined_size }} / 1048576" | bc)
          WAD_MB=$(echo "scale=1; ${{ steps.check.outputs.wad_size }} / 1048576" | bc)
          BIN_MB=$(echo "scale=1; ${{ steps.check.outputs.bin_size }} / 1048576" | bc)

          gh release create "$TAG" \
            output/lol-hashes-combined.zst \
            output/lol-hashes-wad.zst \
            output/lol-hashes-bin.zst \
            --title "Hash DB ${TAG}" \
            --notes "Auto-generated LMDB hash databases from CommunityDragon.

          **3 variants:**
          - \`lol-hashes-combined.zst\` — WAD + BIN hashes (${COMBINED_MB} MB)
          - \`lol-hashes-wad.zst\` — WAD hashes only (${WAD_MB} MB)
          - \`lol-hashes-bin.zst\` — BIN hashes only (${BIN_MB} MB)

          **Key formats:**
          - WAD: u64 xxhash64 (big-endian) → path string
          - BIN: u32 FNV1a (big-endian) → name string

          Fingerprint: ${{ steps.check.outputs.fingerprint }}
          Source: https://github.com/CommunityDragon/Data/tree/master/hashes/lol" \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.existing.outputs.exists }}" = "true" ]; then
            echo "### Skipped — hashes unchanged" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check.outputs.has_output }}" = "true" ]; then
            echo "### Published new release: ${{ steps.existing.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
            echo "- Combined: ${{ steps.check.outputs.combined_size }} bytes" >> $GITHUB_STEP_SUMMARY
            echo "- WAD-only: ${{ steps.check.outputs.wad_size }} bytes" >> $GITHUB_STEP_SUMMARY
            echo "- BIN-only: ${{ steps.check.outputs.bin_size }} bytes" >> $GITHUB_STEP_SUMMARY
          else
            echo "### No output produced" >> $GITHUB_STEP_SUMMARY
          fi
