name: Update LMDB Hashes

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-lmdb-hashes
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --check
      - run: cargo test --locked --all-targets
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo run --locked --release -- output work
      - run: cargo test --locked --release --test corpus -- --ignored
      - name: Publish version 2 tables
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          FP=$(cat output/fingerprint-v2.sha256)
          TAG="hashes-v2-${FP:0:16}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "### Unchanged: $TAG" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cat > output/release-notes.md <<EOF
          LMDB hash databases from CommunityDragon, schema version 2.

          - lol-hashes-v2-combined.zst: wad, binentries, binhashes, binfields, bintypes
          - lol-hashes-v2-wad.zst: wad
          - lol-hashes-v2-bin.zst: binentries, binhashes, binfields, bintypes

          Decompress to data.mdb and open with LMDB. Hashes remain big-endian keys and names remain UTF-8 values.
          BIN categories now use separate named databases. Version 2 is published as a prerelease during consumer migration, preserving the latest legacy LMDB release.

          [File format](https://github.com/RitoShark/lmdb-hashes/blob/${GITHUB_SHA}/docs/file-format.md)
          [Migration guide](https://github.com/RitoShark/lmdb-hashes/blob/${GITHUB_SHA}/docs/migration.md)

          Source fingerprint: $FP
          EOF
          gh release create "$TAG" \
            output/lol-hashes-v2-combined.zst \
            output/lol-hashes-v2-wad.zst \
            output/lol-hashes-v2-bin.zst \
            output/fingerprint-v2.sha256 \
            --target "$GITHUB_SHA" \
            --title "LMDB hashes $TAG" \
            --notes-file output/release-notes.md \
            --prerelease --latest=false
          echo "### Published: $TAG" >> "$GITHUB_STEP_SUMMARY"
