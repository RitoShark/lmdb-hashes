name: Update Hash DB

on:
  schedule:
    - cron: '0 */6 * * *' # Every 6 hours
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build hash-builder
        run: cargo build --release

      - name: Run hash-builder
        run: ./target/release/lmdb-hash-builder output work

      - name: Check if output exists
        id: check
        run: |
          if [ -f output/lol-hashes-combined.zst ]; then
            echo "has_output=true" >> $GITHUB_OUTPUT
            echo "fingerprint=$(cat output/fingerprint.sha256)" >> $GITHUB_OUTPUT
          else
            echo "has_output=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if hashes changed
        if: steps.check.outputs.has_output == 'true'
        id: changed
        run: |
          if [ -f dist/fingerprint.sha256 ]; then
            OLD=$(cat dist/fingerprint.sha256)
            NEW="${{ steps.check.outputs.fingerprint }}"
            if [ "$OLD" = "$NEW" ]; then
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit updated hashes to repo
        if: steps.check.outputs.has_output == 'true' && steps.changed.outputs.changed == 'true'
        run: |
          mkdir -p dist
          cp output/lol-hashes-combined.zst dist/
          cp output/lol-hashes-wad.zst dist/
          cp output/lol-hashes-bin.zst dist/
          cp output/fingerprint.sha256 dist/

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "update hash databases"
          git push

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.changed.outputs.changed }}" = "false" ]; then
            echo "### Skipped — hashes unchanged" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ steps.check.outputs.has_output }}" = "true" ]; then
            echo "### Committed updated hash databases" >> $GITHUB_STEP_SUMMARY
            ls -lh dist/*.zst | awk '{print "- " $9 ": " $5}' >> $GITHUB_STEP_SUMMARY
          else
            echo "### No output produced" >> $GITHUB_STEP_SUMMARY
          fi
